name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  launcher:
    name: Launcher — provere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test (49 provera)
        run: npm test

      - name: IPC harness — registruje 17 handlera i poziva ih sa stubom
        run: node scripts/ipc-harness.js

  bot:
    name: Bot — provere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        working-directory: bot
        run: npm ci

      - name: Bot test (sanitize/store/HTTP ugovor)
        working-directory: bot
        run: npm test

  audit:
    name: npm audit (informativno)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit launcher dependencies
        run: npm audit --audit-level=high

      - name: Audit bot dependencies
        working-directory: bot
        run: npm audit --audit-level=high
